name: Partners — Spider semanal + outreach

on:
  schedule:
    # Lunes 7:00 UTC = 9:00 España (verano)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 cryptography urllib3 playwright

      - name: Instalar Chromium para Playwright
        run: python3 -m playwright install chromium --with-deps

      - name: Ejecutar spider de partners
        env:
          PYTHONUNBUFFERED: "1"
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: cd intel-dashboard && python3 run_partners.py

      # Enriquecimiento: cap 30 min para no bloquear el job completo.
      # Si hay muchos partners nuevos, la siguiente ejecución semanal continúa
      # (el script es idempotente — salta los que ya tienen email).
      - name: Enriquecer emails de partners (scraping web)
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: cd intel-dashboard && python3 enrich_partner_emails.py

      - name: Enviar outreach a partners nuevos con email
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: cd intel-dashboard && python3 send_outreach_partners.py --limit 15

      - name: Followup vacaciones (recontacta quien ya volvió)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: cd intel-dashboard && python3 followup_vacaciones.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add intel-dashboard/index.html intel-dashboard/intel_data.json intel-dashboard/outreach_tracking.json
          git diff --staged --quiet || git commit -m "Partners $(date +'%Y-%m-%d') — spider + enriquecimiento + outreach"
          git push
