name: OKR Manager — cron jobs

on:
  schedule:
    # Lunes 9am España (UTC+2 en verano = 7 UTC)
    - cron: '0 7 * * 1'
    # Diario 7:30am España = 5:30 UTC — market intel
    - cron: '30 5 * * *'
    # Diario 8pm España = 18 UTC — daily sweep
    - cron: '0 18 * * *'
    # Viernes 5pm España = 15 UTC
    - cron: '0 15 * * 5'
    # Cada 5 min: writeback (procesa proposals approved)
    - cron: '*/5 * * * *'
    # Lunes 9:05am España = 7:05 UTC — CRM Pulse (5 min después del monday OKR)
    - cron: '5 7 * * 1'
    # Diario 10am España = 8 UTC — reply checker
    - cron: '0 8 * * *'
    # Diario 8am España = 6 UTC — CRM scoring
    - cron: '0 6 * * *'
    # Cada hora — generate_backlog (pick up iniciativas aprobadas por cualquier vía)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Cuál job correr manualmente'
        required: true
        default: 'monday'
        type: choice
        options: [monday, generate_backlog, daily_sweep, friday, writeback, market_intel, crm_pulse, reply_checker, crm_scoring]
      next_week:
        description: 'Generar para semana siguiente (solo para job=monday)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install Python dependencies
        run: pip install anthropic httpx requests python-dotenv

      - name: Install Playwright (solo para writeback)
        if: github.event.schedule == '*/5 * * * *' || github.event.inputs.job == 'writeback'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Decide which script to run
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT
            echo "next_week=${{ github.event.inputs.next_week || 'false' }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * 1")    echo "job=monday"            >> $GITHUB_OUTPUT ;;
              "30 5 * * *")   echo "job=market_intel"      >> $GITHUB_OUTPUT ;;
              "0 18 * * *")   echo "job=daily_sweep"       >> $GITHUB_OUTPUT ;;
              "0 15 * * 5")   echo "job=friday"            >> $GITHUB_OUTPUT ;;
              "*/5 * * * *")  echo "job=writeback"         >> $GITHUB_OUTPUT ;;
              "5 7 * * 1")    echo "job=crm_pulse"         >> $GITHUB_OUTPUT ;;
              "0 8 * * *")    echo "job=reply_checker"     >> $GITHUB_OUTPUT ;;
              "0 6 * * *")    echo "job=crm_scoring"       >> $GITHUB_OUTPUT ;;
              "0 * * * *")    echo "job=generate_backlog"  >> $GITHUB_OUTPUT ;;
            esac
            echo "next_week=false" >> $GITHUB_OUTPUT
          fi

      - name: Run selected job
        env:
          ETENDO_USERNAME:      ${{ secrets.ETENDO_USERNAME }}
          ETENDO_PASSWORD:      ${{ secrets.ETENDO_PASSWORD }}
          ETENDO_CLIENT_ID:     ${{ secrets.ETENDO_CLIENT_ID }}
          ETENDO_ORG_ID:        ${{ secrets.ETENDO_ORG_ID }}
          ETENDO_WAREHOUSE_ID:  ${{ secrets.ETENDO_WAREHOUSE_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          SERPAPI_KEY:          ${{ secrets.SERPAPI_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          OKR_APPROVER_EMAIL:   ${{ vars.OKR_APPROVER_EMAIL }}
          OKR_SITE_URL:         ${{ vars.OKR_SITE_URL }}
          GOOGLE_OAUTH_CLIENT_ID:        ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:    ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN_GA4_SC:   ${{ secrets.GOOGLE_REFRESH_TOKEN_GA4_SC }}
          GOOGLE_REFRESH_TOKEN_ADS:      ${{ secrets.GOOGLE_REFRESH_TOKEN_ADS }}
          GOOGLE_ADS_DEVELOPER_TOKEN:    ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_MCC_CUSTOMER_ID:    ${{ secrets.GOOGLE_ADS_MCC_CUSTOMER_ID }}
          GOOGLE_ADS_CLIENT_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CLIENT_CUSTOMER_ID }}
          GOOGLE_ADS_API_VERSION:        v20
          GA4_PROPERTY_ID:               ${{ secrets.GA4_PROPERTY_ID }}
          SC_SITE:                       sc-domain:etendo.software
          CRM_PULSE_RECIPIENTS:          ${{ vars.CRM_PULSE_RECIPIENTS }}
          SMTP_USER:                     ${{ secrets.CRM_SMTP_USER }}
          SMTP_PASS:                     ${{ secrets.CRM_SMTP_PASS }}
          IMAP_USER:                     ${{ secrets.CRM_SMTP_USER }}
          IMAP_PASS:                     ${{ secrets.CRM_SMTP_PASS }}
        run: |
          cd scripts
          NEXT_WEEK_FLAG=""
          if [ "${{ steps.pick.outputs.next_week }}" = "true" ]; then
            NEXT_WEEK_FLAG="--next-week"
          fi
          case "${{ steps.pick.outputs.job }}" in
            monday)            python job_monday.py --team marketing $NEXT_WEEK_FLAG ;;
            generate_backlog)  python job_generate_backlog.py ;;
            daily_sweep)       python job_generate_backlog.py && python job_daily_sweep.py ;;
            friday)            python job_friday.py --team marketing --any-status ;;
            writeback)         python job_writeback.py ;;
            market_intel)      python job_market_intel.py --team marketing ;;
            crm_pulse)         python job_monday_crm_pulse.py ;;
            reply_checker)     python job_reply_checker.py ;;
            crm_scoring)       python job_crm_scoring.py ;;
          esac
