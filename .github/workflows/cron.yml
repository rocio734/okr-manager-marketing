name: OKR Manager — cron jobs

on:
  schedule:
    # Lunes 9am España (UTC+2 en verano = 7 UTC)
    - cron: '0 7 * * 1'
    # Diario 8pm España = 18 UTC
    - cron: '0 18 * * *'
    # Viernes 5pm España = 15 UTC
    - cron: '0 15 * * 5'
    # Cada 5 min: writeback (procesa proposals approved)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Cuál job correr manualmente'
        required: true
        default: 'monday'
        type: choice
        options: [monday, generate_backlog, daily_sweep, friday, writeback]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install Playwright (solo para writeback)
        if: github.event.schedule == '*/5 * * * *' || github.event.inputs.job == 'writeback'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Decide which script to run
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * 1")    echo "job=monday"            >> $GITHUB_OUTPUT ;;
              "0 18 * * *")   echo "job=daily_sweep"       >> $GITHUB_OUTPUT ;;
              "0 15 * * 5")   echo "job=friday"            >> $GITHUB_OUTPUT ;;
              "*/5 * * * *")  echo "job=writeback"         >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run selected job
        env:
          ETENDO_USERNAME:      ${{ secrets.ETENDO_USERNAME }}
          ETENDO_PASSWORD:      ${{ secrets.ETENDO_PASSWORD }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          OKR_APPROVER_EMAIL:   ${{ vars.OKR_APPROVER_EMAIL }}
          OKR_SITE_URL:         ${{ vars.OKR_SITE_URL }}
        run: |
          case "${{ steps.pick.outputs.job }}" in
            monday)            python scripts/job_monday.py ;;
            generate_backlog)  python scripts/job_generate_backlog.py ;;
            daily_sweep)
                               python scripts/job_generate_backlog.py
                               python scripts/job_daily_sweep.py ;;
            friday)            python scripts/job_friday.py ;;
            writeback)         python scripts/job_writeback.py ;;
          esac
