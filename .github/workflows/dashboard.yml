name: Dashboard Etendo — Actualización diaria

on:
  schedule:
    # Lunes a viernes a las 07:00 hora España (06:00 UTC en verano)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar dashboard
        env:
          WINDSOR_API_KEY:             ${{ secrets.WINDSOR_API_KEY }}
          ETENDO_BASE_URL:             ${{ secrets.ETENDO_BASE_URL }}
          ETENDO_USERNAME:             ${{ secrets.ETENDO_USERNAME }}
          ETENDO_PASSWORD:             ${{ secrets.ETENDO_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID:      ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:  ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN_GA4_SC: ${{ secrets.GOOGLE_REFRESH_TOKEN_GA4_SC }}
          GA4_PROPERTY_ID:             ${{ secrets.GA4_PROPERTY_ID }}
        run: python fetch_and_build.py

      - name: Commit y push del index.html actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-dashboard/index.html
          git diff --staged --quiet || git commit -m "Dashboard actualizado $(date +'%Y-%m-%d %H:%M UTC')"
          git push
