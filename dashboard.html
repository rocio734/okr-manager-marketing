<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKR Manager — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .action-banner .msg strong { color: var(--c-text); }
  .spinner { display:inline-block; width:15px; height:15px; border:2px solid var(--c-border-strong); border-top-color:var(--c-brand); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Week nav */
  .week-nav { display:flex; align-items:center; gap:var(--sp-2); }
  #week-nav-label { font-size:var(--fs-13); color:var(--c-text-muted); min-width:90px; text-align:center; }

  /* KR group heading */
  .kr-obj-heading {
    font-size: var(--fs-12);
    font-weight: var(--fw-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    color: var(--c-text-muted);
    margin: var(--sp-6) 0 var(--sp-3);
    padding-bottom: var(--sp-2);
    border-bottom: var(--bw-hair) solid var(--c-border);
  }

  /* Next-week hint area */
  #next-week-area .section-eyebrow {
    font-size: var(--fs-11);
    letter-spacing: var(--tracking-wider);
    text-transform: uppercase;
    color: var(--c-text-muted);
    font-weight: var(--fw-semibold);
    margin-bottom: var(--sp-3);
  }

  /* Page header row */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--sp-3);
    margin-bottom: var(--sp-5);
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <nav class="sidebar">
    <a href="dashboard.html" class="sidebar-logo" title="OKR Manager"><img src="assets/etendo_icon.png" alt="Etendo" style="width:28px;height:26px;display:block;"></a>
    <a href="dashboard.html" class="nav-icon active" title="Dashboard">⊞</a>
    <a href="approval-monday.html" class="nav-icon" title="Lunes · Iniciativas">◫</a>
    <a href="kr-proposals-friday.html" class="nav-icon" title="Viernes · KRs">◈</a>
    <a href="market-intel.html" class="nav-icon" title="Visión del Mercado">◉</a>
    <a href="content-queue.html" class="nav-icon" title="Contenido Semanal">✦</a>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-avatar" id="sidebar-avatar">—</div>
  </nav>

  <!-- Workspace -->
  <div class="workspace">
    <header class="topbar"></header>

    <main class="content">
      <!-- Page header: title + week navigation -->
      <div class="page-header">
        <h1 style="margin:0;">Dashboard semanal</h1>
        <div class="week-nav">
          <button class="btn btn-ghost btn-sm" id="btn-prev-week">← Anterior</button>
          <span id="week-nav-label"></span>
          <button class="btn btn-ghost btn-sm" id="btn-next-week">Siguiente →</button>
        </div>
      </div>

      <div id="action-area"></div>
      <div id="cycle-info" class="card" style="display:none;">
        <div id="cycle-info-body"></div>
      </div>
      <div id="krs-block">
        <div class="loading">Cargando...</div>
      </div>

      <div id="next-week-area" style="margin-top:var(--sp-8);display:none;">
        <div class="section-eyebrow">Siguiente semana</div>
        <div class="action-banner" style="background:var(--c-surface-alt);border-color:var(--c-border);">
          <div class="msg" style="color:var(--c-text-muted);">Podés preparar las iniciativas de la próxima semana mientras la actual sigue en curso.</div>
          <button class="btn btn-ghost" id="btn-generate-next">▶ Generar iniciativas — semana siguiente</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  await OKR_renderTopbar('dashboard');

  const sb     = OKR_SB;
  const team   = window.OKR_CONFIG.team;
  const isApp  = await OKR_auth.isApprover();
  const root   = document.getElementById('krs-block');
  const area   = document.getElementById('action-area');

  if (!sb) {
    root.innerHTML = '<div class="empty">Supabase no configurado.</div>';
    return;
  }

  // viewOffset: semanas desde hoy (0 = esta semana, -1 = anterior, +1 = siguiente...)
  let viewOffset = 0;

  document.getElementById('btn-prev-week').addEventListener('click', () => { viewOffset--; render(); });
  document.getElementById('btn-next-week').addEventListener('click', () => { viewOffset++; render(); });

  await render();

  async function render() {
    root.innerHTML = '<div class="loading">Cargando...</div>';
    area.innerHTML = '';

    // Calcular la semana a mostrar según viewOffset
    const todayDate  = new Date();
    const viewDate   = new Date(todayDate);
    viewDate.setDate(todayDate.getDate() + viewOffset * 7);
    const viewStr    = viewDate.toISOString().slice(0, 10);
    const todayStr   = todayDate.toISOString().slice(0, 10);
    const isThisWeek = viewOffset === 0;

    // Actualizar label de navegación
    const navLabel = document.getElementById('week-nav-label');
    navLabel.textContent = isThisWeek ? 'Esta semana' : (viewOffset < 0 ? `hace ${Math.abs(viewOffset)} sem.` : `+${viewOffset} sem.`);

    // Buscar ciclo para la semana visualizada
    const { data: activeCycles } = await sb.from('cycles').select('*')
      .eq('team', team).lte('week_start', viewStr).gte('week_end', viewStr)
      .order('week_start', { ascending: false }).limit(1);
    const cycle = activeCycles && activeCycles[0];

    // Ciclo futuro (solo cuando estamos viendo esta semana)
    let nextCycle = null;
    if (isThisWeek) {
      const { data: futureCycles } = await sb.from('cycles').select('*')
        .eq('team', team).neq('status', 'closed')
        .gt('week_start', todayStr)
        .order('week_start', { ascending: true }).limit(1);
      nextCycle = futureCycles && futureCycles[0];
    }

    // Último ciclo (fallback para mostrar KRs aunque no haya activo)
    const { data: anyCycles } = await sb.from('cycles').select('*')
      .eq('team', team).order('week_start', { ascending: false }).limit(1);
    const lastCycle = anyCycles && anyCycles[0];

    // ── Sin ciclo activo ──────────────────────────────────────────────
    if (!cycle && isThisWeek) {
      if (isApp) showGenerateButton(null);
    }

    // ── Header del ciclo ──────────────────────────────────────────────
    const info = document.getElementById('cycle-info');
    if (cycle) {
      const isCurrentCycle = cycle.week_start <= todayStr && cycle.week_end >= todayStr;
      const weekTag = isCurrentCycle ? '' : ` <span class="hint">(${viewOffset > 0 ? 'próxima semana' : 'semana anterior'})</span>`;
      document.getElementById('cycle-info-body').innerHTML = `
        <div style="display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap;">
          <div>
            <div class="hint">Semana</div>
            <div style="font-size:var(--fs-18);font-weight:var(--fw-semibold);color:var(--c-text);">${OKR_fmt.fmtDate(cycle.week_start)} — ${OKR_fmt.fmtDate(cycle.week_end)}${weekTag}</div>
          </div>
          <div>
            <div class="hint">Estado</div>
            <span class="badge badge-${cycleBadge(cycle.status)}">${cycle.status.replace(/_/g,' ')}</span>
          </div>
        </div>
      `;
      info.style.display = '';
    } else {
      info.style.display = 'none';
    }

    // ── Banners según estado (solo ciclo activo o visible) ───────────
    if (cycle && cycle.status === 'pending_initiative_approval' && isApp) {
      area.innerHTML = `
        <div class="action-banner">
          <div class="msg">Las iniciativas están listas. <strong>Revisalas y aprobá el batch</strong> para arrancar la semana.</div>
          <a href="approval-monday.html" class="btn btn-primary">Revisar iniciativas →</a>
        </div>`;
    }
    if (cycle && cycle.status === 'in_progress' && isApp && isThisWeek) {
      area.innerHTML = `
        <div class="action-banner">
          <div class="msg">Ciclo activo. Cuando estés lista, <strong>proponé los nuevos valores de KR</strong> basándote en las iniciativas completadas.</div>
          <button class="btn btn-primary" id="btn-propose">Proponer valores de KR</button>
        </div>`;
      document.getElementById('btn-propose').addEventListener('click', () => proposeKRs(cycle));
    }
    if (cycle && cycle.status === 'pending_kr_approval' && isApp) {
      area.innerHTML = `
        <div class="action-banner">
          <div class="msg">Los nuevos valores de KR están listos. <strong>Revisalos y aprobá</strong> para escribirlos en Etendo.</div>
          <a href="kr-proposals-friday.html" class="btn btn-primary">Revisar propuestas →</a>
        </div>`;
    }

    // ── KRs + iniciativas ─────────────────────────────────────────────
    const displayCycle = cycle || lastCycle;
    const krSnapshot   = (displayCycle && displayCycle.kr_snapshot) || [];
    const initsByKr    = {};

    if (cycle) {
      const { data: inits } = await sb.from('initiatives').select('*')
        .eq('cycle_id', cycle.id)
        .in('status', ['proposed','approved','in_progress','suggested_completed','completed','rejected'])
        .order('created_at', { ascending: true });
      (inits || []).forEach(i => {
        initsByKr[i.kr_id] = initsByKr[i.kr_id] || [];
        initsByKr[i.kr_id].push(i);
      });
    }

    if (!krSnapshot.length) {
      root.innerHTML = '<div class="loading">Cargando KRs desde Etendo...</div>';
      try {
        const res = await fetch('http://localhost:8081/krs?team=' + encodeURIComponent(team));
        const liveKrs = await res.json();
        if (liveKrs && liveKrs.length) { renderKrCards(liveKrs, {}, null); return; }
      } catch (e) { /* backend no disponible */ }
      root.innerHTML = `<div class="empty">${cycle ? 'Sin KRs en el snapshot.' : 'No hay ciclo para esta semana.'}</div>`;
      return;
    }

    renderKrCards(krSnapshot, initsByKr, displayCycle);

    // ── Sección "Siguiente semana" (solo cuando vemos esta semana) ────
    const nwa = document.getElementById('next-week-area');
    if (isThisWeek && cycle && cycle.status !== 'closed') {
      nwa.style.display = '';
      const existingMsg = nwa.querySelector('.msg');
      const btnNext     = nwa.querySelector('#btn-generate-next');

      if (nextCycle) {
        btnNext.style.display = 'none';
        const weekLabel = OKR_fmt.fmtDate(nextCycle.week_start) + ' — ' + OKR_fmt.fmtDate(nextCycle.week_end);
        const statusLabels = {
          pending_initiative_approval: 'Iniciativas listas para aprobar',
          in_progress:                 'Ciclo en curso',
          pending_kr_approval:         'KRs listos para revisar',
        };
        const label = statusLabels[nextCycle.status] || nextCycle.status.replace(/_/g, ' ');
        existingMsg.innerHTML = `Semana siguiente <strong>${weekLabel}</strong>: ${label}
          <button class="btn btn-ghost btn-sm" style="margin-left:var(--sp-3);" onclick="document.getElementById('btn-next-week').click()">Ver →</button>`;
      } else {
        btnNext.style.display = '';
        btnNext.onclick = async () => {
          btnNext.disabled = true;
          btnNext.innerHTML = '<span class="spinner"></span>Generando iniciativas...';
          try {
            const since = new Date().toISOString();
            const r = await OKR_triggerJob('monday', { next_week: 'true' });
            if (!r.ok) { OKR_toast('Error al disparar el agente (' + (r.error || r.status) + ')', 'error'); btnNext.disabled = false; btnNext.textContent = '▶ Generar iniciativas — semana siguiente'; return; }
            btnNext.innerHTML = '<span class="spinner"></span>Esperando al agente...';
            const poll = setInterval(async () => {
              const { data } = await sb.from('initiatives')
                .select('id').eq('status', 'proposed').gte('created_at', since).limit(1);
              if (data && data.length) {
                clearInterval(poll);
                OKR_toast('✓ Iniciativas listas', 'success');
                await render();
              }
            }, 3000);
            setTimeout(() => { clearInterval(poll); btnNext.disabled = false; btnNext.textContent = '▶ Generar iniciativas — semana siguiente'; }, 300000);
          } catch (e) {
            OKR_toast('Error al disparar el agente.', 'error');
            btnNext.disabled = false;
            btnNext.textContent = '▶ Generar iniciativas — semana siguiente';
          }
        };
      }
    } else {
      nwa.style.display = 'none';
    }
  }

  function renderKrCards(krs, initsByKr, cycle) {
    // Agrupar KRs por objective
    const byObj = {};
    const objOrder = [];
    for (const kr of krs) {
      const obj = kr.objective || '(sin objetivo)';
      if (!byObj[obj]) { byObj[obj] = []; objOrder.push(obj); }
      byObj[obj].push(kr);
    }

    root.innerHTML = objOrder.map(obj => `
      <div style="margin-bottom:var(--sp-8);">
        <div class="kr-obj-heading">${OKR_fmt.escapeHtml(obj)}</div>
        ${byObj[obj].map(kr => {
          // Status calculation
          const hasBoth = kr.current != null && kr.target != null && kr.target !== 0;
          const pct     = hasBoth ? Math.min(100, Math.round(kr.current / kr.target * 100)) : null;
          const cycleEnded = cycle && cycle.status === 'closed';
          const rawSt = kr.status
            ? kr.status
            : (!hasBoth ? 'not_started' : pct >= 100 ? 'success' : pct >= 75 ? 'on_track' : pct >= 50 ? 'at_risk' : 'off_track');
          const st = (rawSt === 'failed' && !cycleEnded) ? 'off_track' : rawSt;
          const stMap = {
            not_started: { label: 'Not Started', bg: 'var(--c-neutral-soft)',  color: 'var(--c-text-muted)', bar: 'var(--c-border-strong)', border: 'var(--c-border-strong)' },
            on_track:    { label: 'On Track',    bg: 'var(--c-success-soft)',  color: 'var(--c-success)',    bar: 'var(--c-success)',       border: 'var(--c-success)'       },
            at_risk:     { label: 'At Risk',     bg: 'var(--c-warning-soft)',  color: 'var(--c-warning)',    bar: 'var(--c-warning)',       border: 'var(--c-warning)'       },
            off_track:   { label: 'Off Track',   bg: '#FFE8D6',                color: '#C2540A',             bar: '#C2540A',               border: '#C2540A'                },
            failed:      { label: 'Failed',      bg: 'var(--c-danger-soft)',   color: 'var(--c-danger)',     bar: 'var(--c-danger)',        border: 'var(--c-danger)'        },
            success:     { label: 'Success',     bg: 'var(--c-success-soft)',  color: 'var(--c-success)',    bar: 'var(--c-success)',       border: 'var(--c-success)'       },
          };
          const s = stMap[st] || stMap['not_started'];
          return `
          <div class="card kr-block" style="border-left:3px solid ${s.border};">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--sp-2);">
              <h2 style="margin:0;font-size:var(--fs-16);font-weight:var(--fw-semibold);color:var(--c-text);">${OKR_fmt.escapeHtml(kr.name)}</h2>
              <div style="display:flex;gap:var(--sp-4);align-items:center;font-size:var(--fs-13);color:var(--c-text-muted);">
                ${kr.current != null ? `<span>Actual: <strong style="color:var(--c-text);">${kr.current}</strong></span>` : ''}
                ${kr.target  != null ? `<span>Target: <strong style="color:var(--c-text);">${kr.target}</strong></span>`  : ''}
                <span style="background:${s.bg};color:${s.color};padding:2px 10px;border-radius:var(--r-pill);font-size:var(--fs-12);font-weight:var(--fw-semibold);">${s.label}</span>
              </div>
            </div>
            ${pct !== null ? `
            <div class="progress">
              <span style="width:${pct}%;display:block;height:100%;background:${s.bar};border-radius:var(--r-pill);"></span>
            </div>` : ''}
            <div style="margin-top:var(--sp-3);">
              ${(initsByKr[kr.id] || []).length
                ? (initsByKr[kr.id] || []).map(initRow).join('')
                : `<div class="hint" style="padding:var(--sp-2) 0;">Sin iniciativas aprobadas aún.</div>`
              }
            </div>
          </div>`;
        }).join('')}
      </div>
    `).join('');
  }

  // ── Proponer valores de KR ────────────────────────────────────────
  async function proposeKRs(cycle) {
    const btn = document.getElementById('btn-propose');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Generando propuestas...';

    try {
      const r = await OKR_triggerJob('friday');
      if (!r.ok) { btn.disabled = false; btn.textContent = 'Proponer valores de KR'; OKR_toast('Error al disparar el agente (' + (r.error || r.status) + ')', 'error'); return; }
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Proponer valores de KR';
      OKR_toast('Error al conectar con GitHub Actions.', 'error');
      return;
    }
    btn.innerHTML = '<span class="spinner"></span>Analizando evidencia de la semana...';
    OKR_toast('Generando propuestas con IA...', 'success');
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      const { data } = await sb.from('kr_proposals')
        .select('id').eq('cycle_id', cycle.id).limit(1);
      if ((data && data.length) || attempts > 40) {
        clearInterval(poll);
        if (data && data.length) {
          OKR_toast('Propuestas listas. Redirigiendo...', 'success');
          setTimeout(() => location.href = 'kr-proposals-friday.html', 1000);
        } else {
          btn.disabled = false; btn.textContent = 'Proponer valores de KR';
          OKR_toast('Tiempo agotado. Intentá de nuevo.', 'error');
        }
      }
    }, 3000);
  }

  // ── Botón generar iniciativas ────────────────────────────────────
  function showGenerateButton(closedCycle) {
    const today  = new Date();
    const dow    = today.getDay();
    const diff   = (dow === 0 ? -6 : 1 - dow);
    const monday = new Date(today);
    monday.setDate(today.getDate() + diff);
    const label  = monday.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });

    area.innerHTML = `
      <div class="action-banner">
        <div class="msg">No hay ciclo activo. <strong>Generá las iniciativas de la semana del ${label}</strong>.</div>
        <button class="btn btn-primary" id="btn-generate">▶ Generar iniciativas — semana del ${label}</button>
      </div>`;

    document.getElementById('btn-generate').addEventListener('click', () => generateInits());
  }

  async function generateInits() {
    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    try {
      const r = await OKR_triggerJob('monday');
      if (!r.ok) { btn.disabled = false; OKR_toast('Error al disparar el agente (' + (r.error || r.status) + ')', 'error'); return; }
    } catch (e) {
      btn.disabled = false;
      OKR_toast('Error al conectar con GitHub Actions.', 'error');
      return;
    }
    btn.innerHTML = '<span class="spinner"></span>Esperando resultados (~3 min)...';

    OKR_toast('✓ Agente disparado en GitHub Actions — las iniciativas aparecerán en ~3 minutos', 'success');
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      const { data: cs } = await sb.from('cycles').select('id')
        .eq('team', team).eq('status', 'pending_initiative_approval').limit(1);
      if (cs && cs.length) {
        const { data: inits } = await sb.from('initiatives').select('id')
          .eq('cycle_id', cs[0].id).limit(1);
        if (inits && inits.length) {
          clearInterval(poll);
          OKR_toast('Iniciativas listas. Redirigiendo...', 'success');
          setTimeout(() => location.href = 'approval-monday.html', 1000);
          return;
        }
      }
      if (attempts > 100) {
        clearInterval(poll);
        btn.disabled = false;
        btn.textContent = '⚡ Generar iniciativas con el agente';
        OKR_toast('El agente tardó más de lo esperado. Recargá la página en unos minutos.', 'error');
      }
    }, 3000);
  }

  // Escuchar cuando un ciclo pasa a closed para mostrar botón de nueva semana
  if (sb) {
    sb.channel('cycles-changes')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cycles' }, () => render())
      .subscribe();
  }

  function initRow(i) {
    const completed = ['completed','suggested_completed'].includes(i.status);
    return `
      <a href="initiative.html?id=${i.id}" class="initiative" style="text-decoration:none;color:inherit;">
        <div class="init-body">
          <div class="init-title ${completed ? 'completed' : ''}">${OKR_fmt.escapeHtml(i.title)}</div>
          ${i.execution_plan ? `<div class="init-plan">${OKR_fmt.escapeHtml(i.execution_plan).slice(0,200)}${i.execution_plan.length>200?'…':''}</div>` : ''}
          <div class="init-meta">${i.created_by==='human'?'✱ manual · ':''}${OKR_fmt.timeAgo(i.created_at)}</div>
        </div>
        <div class="init-actions">
          <span class="badge badge-${i.status.replace('suggested_completed','suggested')}">${i.status.replace(/_/g,' ')}</span>
        </div>
      </a>`;
  }

  function cycleBadge(s) {
    if (s === 'closed')                     return 'completed';
    if (s === 'pending_initiative_approval') return 'proposed';
    if (s === 'pending_kr_approval')         return 'suggested';
    return 'approved';
  }

})();
</script>
</body>
</html>
