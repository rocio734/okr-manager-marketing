name: Test Windsor.ai GA4 fields

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run field tests
        env:
          ETENDO_BASE_URL: ${{ secrets.ETENDO_BASE_URL }}
          ETENDO_USERNAME: ${{ secrets.ETENDO_USERNAME }}
          ETENDO_PASSWORD: ${{ secrets.ETENDO_PASSWORD }}
        run: python test_crm_fields.py
