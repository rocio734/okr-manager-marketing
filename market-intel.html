<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKR Manager — Visión del Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<style>
  .spinner { display:inline-block; width:15px; height:15px; border:2px solid var(--c-border-strong); border-top-color:var(--c-brand); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <nav class="sidebar">
    <a href="dashboard.html" class="sidebar-logo" title="OKR Manager"><img src="assets/etendo_icon.png" alt="Etendo" style="width:28px;height:26px;display:block;"></a>
    <a href="dashboard.html" class="nav-icon" title="Dashboard">⊞</a>
    <a href="approval-monday.html" class="nav-icon" title="Lunes · Iniciativas">◫</a>
    <a href="kr-proposals-friday.html" class="nav-icon" title="Viernes · KRs">◈</a>
    <a href="market-intel.html" class="nav-icon active" title="Visión del Mercado">◉</a>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-avatar" id="sidebar-avatar">—</div>
  </nav>

  <!-- Workspace -->
  <div class="workspace">
    <header class="topbar"></header>

    <main class="content">
      <div class="intel-header">
        <h1 style="margin:0;">Visión del Mercado</h1>
        <div style="display:flex;gap:var(--sp-3);align-items:center;">
          <span class="intel-ts" id="intel-ts"></span>
          <button class="btn btn-primary" id="btn-refresh">⚡ Actualizar análisis</button>
        </div>
      </div>
      <div id="intel-body">
        <div class="loading-msg">Cargando último análisis...</div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  await OKR_renderTopbar('market-intel');

  const sb   = OKR_SB;
  const team = window.OKR_CONFIG?.team || 'marketing';
  const body = document.getElementById('intel-body');

  function esc(s) { return OKR_fmt.escapeHtml(String(s || '')); }

  function renderIntel(row) {
    if (!row) {
      body.innerHTML = '<div class="loading-msg">No hay análisis todavía. Hacé click en "Actualizar análisis" para generar uno.</div>';
      return;
    }
    const a = row.analysis || {};
    const ts = row.generated_at ? new Date(row.generated_at).toLocaleString('es-ES') : '—';
    document.getElementById('intel-ts').textContent = `Último análisis: ${ts}`;

    const serp = row.serp_data || [];

    body.innerHTML = `

      ${a.resumen_ejecutivo ? `
      <div class="resumen">${esc(a.resumen_ejecutivo)}</div>` : ''}

      <div class="intel-grid">

        <!-- Posición Etendo -->
        ${a.posicion_etendo ? `
        <div class="intel-card">
          <h3>Posición de Etendo</h3>
          ${(a.posicion_etendo.fortalezas||[]).length ? `
            <div style="font-size:var(--fs-11);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--c-success);margin-bottom:var(--sp-2);font-weight:var(--fw-semibold);">Fortalezas</div>
            ${(a.posicion_etendo.fortalezas||[]).map(f=>`<div style="font-size:var(--fs-13);color:var(--c-text-body);padding:4px 0;border-bottom:var(--bw-hair) solid var(--c-border);">✓ ${esc(f)}</div>`).join('')}
          ` : ''}
          ${(a.posicion_etendo.brechas||[]).length ? `
            <div style="font-size:var(--fs-11);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--c-danger);margin:var(--sp-4) 0 var(--sp-2);font-weight:var(--fw-semibold);">Brechas</div>
            ${(a.posicion_etendo.brechas||[]).map(b=>`<div style="font-size:var(--fs-13);color:var(--c-text-body);padding:4px 0;border-bottom:var(--bw-hair) solid var(--c-border);">✗ ${esc(b)}</div>`).join('')}
          ` : ''}
        </div>` : ''}

        <!-- Acciones esta semana -->
        ${(a.acciones_semana||[]).length ? `
        <div class="intel-card">
          <h3>Acciones esta semana</h3>
          ${(a.acciones_semana||[]).map(ac=>`
            <div class="action-item">
              <span class="action-urgencia urg-${esc(ac.urgencia)}">${esc(ac.urgencia).replace('_',' ')}</span>
              <div class="action-body">
                <div class="action-text">${esc(ac.accion)}</div>
                <div class="action-resp">${esc(ac.responsable)}</div>
              </div>
            </div>`).join('')}
        </div>` : ''}

      </div>

      <!-- Competidores -->
      ${(a.competidores||[]).length ? `
      <div class="intel-card" style="margin-bottom:var(--sp-4);">
        <h3>Competidores detectados</h3>
        ${(a.competidores||[]).map(c=>`
          <div class="comp-row">
            <div class="comp-name">${esc(c.nombre)}</div>
            <div class="comp-body">
              <div>${esc(c.movimiento_detectado)}</div>
              <div class="comp-diff">${esc(c.diferenciador_vs_etendo)}</div>
            </div>
            <span class="threat threat-${esc(c.amenaza)}">${esc(c.amenaza)}</span>
          </div>`).join('')}
      </div>` : ''}

      <!-- Oportunidades -->
      ${(a.oportunidades||[]).length ? `
      <div class="intel-card" style="margin-bottom:var(--sp-4);">
        <h3>Oportunidades detectadas</h3>
        ${(a.oportunidades||[]).map(o=>`
          <div class="opp-item">
            <div class="opp-top">
              <span class="opp-canal">${esc(o.canal)}</span>
              <span class="opp-impacto imp-${esc(o.impacto)}">${esc(o.impacto)}</span>
            </div>
            <div class="opp-desc">${esc(o.descripcion)}</div>
            <div class="opp-accion">${esc(o.accion_concreta)}</div>
          </div>`).join('')}
      </div>` : ''}

      <!-- SERP data -->
      ${serp.length ? `
      <div class="intel-card">
        <h3>Posicionamiento Google (España)</h3>
        <div class="serp-grid">
          ${serp.map(r=>{
            const posClass = !r.etendo_position ? 'pos-out' : r.etendo_position<=3 ? 'pos-top3' : 'pos-top10';
            const posText  = !r.etendo_position ? 'fuera top10' : `#${r.etendo_position}`;
            return `
            <div class="serp-item">
              <div class="serp-query">${esc(r.label)} — "${esc(r.query)}"</div>
              <div class="serp-etendo">Etendo: <span class="pos-badge ${posClass}">${posText}</span></div>
              <div class="serp-top">${(r.top5||[]).slice(0,3).map(x=>`${x.pos}. ${esc(x.title.slice(0,50))}`).join('<br>')}</div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    `;
  }

  const MAX_AGE_HOURS = 24; // datos frescos = menos de 24h

  function isStale(row) {
    if (!row?.generated_at) return true;
    const age = (Date.now() - new Date(row.generated_at)) / 3600000;
    return age > MAX_AGE_HOURS;
  }

  async function triggerRefresh() {
    const btn = document.getElementById('btn-refresh');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Disparando análisis...';
    try {
      const since = new Date().toISOString();
      const r = await OKR_triggerJob('market_intel');
      if (!r.ok) {
        OKR_toast('Error al disparar el job (' + (r.error || r.status) + ')', 'error');
        btn.disabled = false; btn.textContent = '⚡ Actualizar análisis'; return;
      }
      OKR_toast('✓ Job disparado — el análisis llegará en ~5 minutos', 'success');
      btn.innerHTML = '<span class="spinner"></span>Esperando análisis...';
      const poll = setInterval(async () => {
        const { data } = await sb.from('market_intel')
          .select('*').eq('team', team)
          .gte('generated_at', since)
          .order('generated_at', { ascending: false }).limit(1);
        if (data && data.length) {
          clearInterval(poll);
          renderIntel(data[0]);
          btn.disabled = false;
          btn.textContent = '⚡ Actualizar análisis';
          OKR_toast('✓ Análisis del día listo', 'success');
        }
      }, 5000);
      // 10 minutos de espera máxima
      setTimeout(() => { clearInterval(poll); btn.disabled = false; btn.textContent = '⚡ Actualizar análisis'; OKR_toast('El análisis tardó más de lo esperado. Recargá la página en unos minutos.', 'error'); }, 600000);
    } catch (e) {
      OKR_toast('Error al conectar con GitHub Actions.', 'error');
      btn.disabled = false; btn.textContent = '⚡ Actualizar análisis';
    }
  }

  // Cargar último análisis — si está desactualizado, regenerar automáticamente
  async function loadLatest() {
    if (!sb) { body.innerHTML = '<div class="loading-msg">Supabase no configurado.</div>'; return null; }
    try {
      const { data } = await sb.from('market_intel')
        .select('*').eq('team', team)
        .order('generated_at', { ascending: false }).limit(1);
      return data && data[0];
    } catch (e) {
      body.innerHTML = '<div class="loading-msg">Tabla market_intel no encontrada. Ejecutá <code>sql/market_intel_table.sql</code> en Supabase y recargá.</div>';
      return null;
    }
  }

  const latest = await loadLatest();
  if (latest === null) {
    // tabla no existe, ya mostró el mensaje
  } else if (!latest) {
    body.innerHTML = `<div class="loading-msg">No hay análisis todavía. Hacé click en "Actualizar análisis" para generarlo.</div>`;
  } else {
    // Siempre mostrar los datos disponibles, aunque sean viejos
    renderIntel(latest);
    if (isStale(latest)) {
      const hoursOld = Math.round((Date.now() - new Date(latest.generated_at)) / 3600000);
      const staleBar = document.createElement('div');
      staleBar.className = 'stale-bar';
      staleBar.innerHTML = `⚠ Datos de hace ${hoursOld}h. Hacé click en "Actualizar análisis" para obtener el análisis de hoy.`;
      body.prepend(staleBar);
    }
  }

  document.getElementById('btn-refresh').addEventListener('click', triggerRefresh);

  // Realtime: si llega nuevo análisis, actualizar automáticamente
  sb?.channel('market-intel-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'market_intel' }, payload => {
      if (payload.new?.team === team) renderIntel(payload.new);
    })
    .subscribe();
})();
</script>
</body>
</html>
