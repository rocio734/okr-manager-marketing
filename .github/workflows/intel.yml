name: Etendo Intelligence — Actualización diaria

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias base
        run: pip install requests beautifulsoup4 cryptography openai

      - name: Instalar Scrapling con fetchers
        run: |
          pip install "scrapling[fetchers]"
          scrapling install || echo "⚠️ Scrapling browsers install falló — continuando sin browser headless"
        continue-on-error: true

      - name: Ejecutar script
        env:
          GOOGLE_API_KEY:              ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:               ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_MAPS_API_KEY:         ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HUNTER_API_KEY:              ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY:              ${{ secrets.APOLLO_API_KEY }}
          BRAVE_API_KEY:               ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY:              ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USER:                  ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD_ROCIO:        ${{ secrets.GMAIL_PASSWORD_ROCIO }}
        run: cd intel-dashboard && python fetch_intel.py

      - name: Generar borradores de engagement
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/agent_forum_monitor.py --mode batch --max 15

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add intel-dashboard/index.html intel-dashboard/intel_data.json intel-dashboard/engagement_opportunities.json
          git diff --staged --quiet || git commit -m "Intelligence $(date +'%Y-%m-%d %H:%M UTC')"
          git push
