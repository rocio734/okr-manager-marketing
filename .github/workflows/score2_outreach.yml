name: Score 2 — Outreach diario

on:
  schedule:
    # 8:00 UTC = 10:00 España (lunes a viernes)
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-score2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 cryptography urllib3 scrapling curl-cffi

      - name: Enviar outreach score 2 (50/día)
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: cd intel-dashboard && python3 send_outreach_score2.py

      - name: Commit y push tracking
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add intel-dashboard/outreach_tracking.json
          git diff --staged --quiet || git commit -m "Score2 outreach $(date +'%Y-%m-%d') — batch diario"
          git pull --rebase origin main
          git push
